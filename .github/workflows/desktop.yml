name: Desktop CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  compile-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic
      - name: Build the default native JavaFX and Rust workspace
        working-directory: apps/desktop
        run: gradle buildRustEngine compileJava
      - name: Validate optional compatibility stack and migrated research source
        run: |
          gradle -p apps/desktop setupLocalBackend buildFrontend syncFrontendResources
          python -m compileall -q backend training/src scripts/ml
          python -c "import glob,json; [json.load(open(p,encoding='utf-8')) for p in glob.glob('training/*.ipynb')]; print('All training notebooks are valid JSON')"
      - name: Smoke test migrated FastAPI with local SQLite (Ubuntu)
        if: runner.os == 'Linux'
        run: backend/.venv/bin/python backend/tests/smoke_local_backend.py
      - name: Smoke test migrated FastAPI with local SQLite (Windows)
        if: runner.os == 'Windows'
        run: backend/.venv/Scripts/python.exe backend/tests/smoke_local_backend.py
