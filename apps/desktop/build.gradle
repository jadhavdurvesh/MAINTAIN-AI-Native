plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'tech.dmj.maintain'
version = '0.1.0'

repositories { mavenCentral() }

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.3'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

javafx {
    version = '21.0.5'
    modules = [ 'javafx.controls', 'javafx.graphics' ]
}

application {
    mainClass = 'tech.dmj.maintain.App'
}

tasks.register('buildRustEngine', Exec) {
    workingDir file('../..')
    commandLine 'cargo', 'build', '--package', 'maintain-engine'
}

tasks.named('run') {
    dependsOn 'buildRustEngine'
}
