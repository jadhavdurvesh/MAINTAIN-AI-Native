[workspace]
resolver = "2"
members = ["crates/app-core", "crates/analytics", "crates/device-io", "crates/persistence", "crates/protocol", "crates/engine"]
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["DMJ Group"]
[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
